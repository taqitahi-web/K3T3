<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pages From My Life</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a5a3b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <nav class="sidebar" aria-label="Main navigation">
    <div class="brand">Pages From My Life</div>
    <button class="navlink" data-route="home"><span>🏠</span> Home</button>
    <button class="navlink" data-route="timeline"><span>📖</span> Timeline</button>
    <button class="navlink" data-route="calendar"><span>📅</span> Calendar</button>
    <button class="navlink" data-route="photos"><span>📷</span> Photos</button>
    <button class="navlink" data-route="favorites"><span>⭐</span> Favorites</button>
    <button class="navlink" data-route="onthisday"><span>🔄</span> On This Day</button>
    <button class="navlink" data-route="stats"><span>📊</span> Statistics</button>
    <div class="section-label">Years</div>
    <div id="year-nav"></div>
    <div style="flex:1"></div>
    <button class="navlink" data-route="settings"><span>⚙️</span> Settings</button>
  </nav>

  <div class="main">
    <div class="topbar">
      <h1 id="topbar-title">Pages From My Life</h1>
      <div class="actions">
        <button class="btn btn-icon" id="btn-search" title="Search (Ctrl+K)" aria-label="Search">🔍</button>
        <button class="btn btn-primary" id="btn-new-top">+ New</button>
      </div>
    </div>
    <div class="content-scroll" id="main-content"></div>
  </div>
</div>

<div class="bottom-nav" aria-label="Bottom navigation">
  <button data-route="home"><span class="emoji">🏠</span>Home</button>
  <button data-route="timeline"><span class="emoji">📖</span>Timeline</button>
  <button id="fab-toggle-mobile"><span class="emoji">➕</span>Write</button>
  <button data-route="photos"><span class="emoji">📷</span>Photos</button>
  <button id="btn-search-mobile"><span class="emoji">🔍</span>Search</button>
</div>
<button class="fab" id="fab-btn" aria-label="Quick capture">+</button>
<div class="fab-menu" id="fab-menu" style="display:none;"></div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script src="js/database.js"></script>
<script src="js/ui.js"></script>
<script src="js/photos.js"></script>
<script src="js/voice.js"></script>
<script src="js/calendar.js"></script>
<script src="js/search.js"></script>
<script src="js/export.js"></script>
<script src="js/share.js"></script>
<script src="js/sync.js"></script>
<script src="js/journal.js"></script>
<script src="js/app.js"></script>
<script type="module" src="js/firebase-sync.js"></script>
</body>
</html>
